<!doctype html>
<html lang="en" class="h-full bg-slate-50 antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      BloodGuard — Emergency Blood Coordination & Real-Time Broadcast Platform
    </title>

    <!-- Tailwind CSS CDN with fallback local styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (window.tailwind) {
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                medical: {
                  50: "#fef2f2",
                  100: "#fee2e2",
                  200: "#fecaca",
                  500: "#ef4444",
                  600: "#dc2626",
                  700: "#b91c1c",
                  800: "#991b1b",
                  900: "#7f1d1d",
                },
              },
              boxShadow: {
                emergency:
                  "0 0 0 2px rgba(220, 38, 38, 0.25), 0 10px 25px -5px rgba(220, 38, 38, 0.25)",
                card: "0 2px 10px -2px rgba(15, 23, 42, 0.06), 0 8px 24px -4px rgba(15, 23, 42, 0.08)",
              },
            },
          },
        };
      }
    </script>

    <style>
      /* Essential Fallback Styles ensuring 100% offline & robust rendering */
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          sans-serif;
        margin: 0;
        background-color: #f8fafc;
        color: #0f172a;
      }
      .glass-nav {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid #e2e8f0;
      }
      .btn-red {
        background-color: #dc2626;
        color: #ffffff;
        font-weight: 700;
        border-radius: 0.75rem;
        padding: 0.625rem 1.25rem;
        transition: all 0.15s ease-in-out;
        border: none;
        cursor: pointer;
      }
      .btn-red:hover {
        background-color: #b91c1c;
      }
      .btn-red:active {
        transform: scale(0.97);
      }
      .pulse-emergency {
        animation: pulseAnim 2s infinite ease-in-out;
      }
      @keyframes pulseAnim {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.02);
        }
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
    </style>
  </head>
  <body
    class="h-full bg-slate-50 text-slate-900 selection:bg-red-500 selection:text-white flex flex-col min-h-screen"
  >
    <!-- APP CONTAINER (Reactively Rendered by Pure JS) -->
    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <!-- TOAST CONTAINER -->
    <div
      id="toast-container"
      class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 max-w-md w-full pointer-events-none"
    ></div>

    <!-- MODAL CONTAINER -->
    <div
      id="modal-container"
      class="fixed inset-0 z-50 hidden overflow-y-auto flex items-center justify-center p-4"
    ></div>

    <!-- JAVASCRIPT APPLICATION SCRIPT (100% Pure, Zero External Compiler Dependencies) -->
    <script>
      // ==========================================
      // DATA STORE — No hardcoded demo data.
      // All data comes from MongoDB via /api/* endpoints.
      // ==========================================

      // Inventory defaults (shown before API loads, overwritten immediately)
      const DEFAULT_INVENTORY = [
        { bloodGroup: "A+", units: 0, status: "critical", lastUpdated: null },
        { bloodGroup: "A-", units: 0, status: "critical", lastUpdated: null },
        { bloodGroup: "B+", units: 0, status: "critical", lastUpdated: null },
        { bloodGroup: "B-", units: 0, status: "critical", lastUpdated: null },
        { bloodGroup: "AB+", units: 0, status: "critical", lastUpdated: null },
        { bloodGroup: "AB-", units: 0, status: "critical", lastUpdated: null },
        { bloodGroup: "O+", units: 0, status: "critical", lastUpdated: null },
        { bloodGroup: "O-", units: 0, status: "critical", lastUpdated: null },
      ];

      // Single guest placeholder — replaced immediately after login
      const GUEST_USER = {
        id: null,
        name: "Guest",
        email: "",
        phone: "",
        role: "guest",
        bloodGroup: "",
        isAvailable: false,
        totalDonations: 0,
        avatarUrl: "",
      };

      // Application State — starts empty, populated from API
      const AppState = {
        currentUser: GUEST_USER,
        activeTab: "landing",
        sidebarTab: "overview",
        requests: [],
        inventory:
          JSON.parse(localStorage.getItem("bg_inventory")) || DEFAULT_INVENTORY,
        notifications: [],
      };

      function saveState() {
        if (AppState.inventory.length) {
          localStorage.setItem(
            "bg_inventory",
            JSON.stringify(AppState.inventory),
          );
        }
      }

      // ==========================================
      // UTILITIES
      // ==========================================
      function calculateEligibility(donor) {
        const bloodGroup = donor?.bloodGroup || "";
        const isAvailable = donor?.isAvailable ?? true;
        const lastDonationStr = donor?.lastDonationDate
          ? donor.lastDonationDate.split("T")[0]
          : null;
        const today = new Date();

        // If never donated — treat as fully eligible (no 56-day restriction)
        let diffDays = 999,
          nextEligibleStr = "Now",
          hasWaitedEnough = true;
        if (lastDonationStr) {
          const lastDonationDate = new Date(lastDonationStr);
          diffDays = Math.max(
            0,
            Math.floor(
              (today.getTime() - lastDonationDate.getTime()) /
                (1000 * 60 * 60 * 24),
            ),
          );
          const nextEligible = new Date(lastDonationDate);
          nextEligible.setDate(nextEligible.getDate() + 56);
          nextEligibleStr = nextEligible.toISOString().split("T")[0];
          hasWaitedEnough = diffDays >= 56;
        }

        const isEligible = hasWaitedEnough && isAvailable;

        let reason = "";
        if (!hasWaitedEnough) {
          const remaining = 56 - diffDays;
          reason = `Clinical 56-day rule active (${remaining} days remaining). Next eligible: ${nextEligibleStr}`;
        } else if (!isAvailable) {
          reason = "Your availability is set to UNAVAILABLE.";
        }

        return {
          bloodGroup,
          isAvailable,
          lastDonationStr: lastDonationStr || "Never donated",
          nextEligibleStr,
          isEligible,
          reason,
        };
      }

      function showToast(message, type = "info") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        const bg =
          type === "emergency"
            ? "bg-red-950 text-red-100 border-red-700 shadow-emergency"
            : type === "success"
              ? "bg-emerald-950 text-emerald-100 border-emerald-700"
              : type === "warning"
                ? "bg-amber-950 text-amber-100 border-amber-700"
                : "bg-slate-900 text-white border-slate-700";

        toast.className = `pointer-events-auto p-4 rounded-2xl border text-xs font-bold shadow-2xl flex items-center justify-between gap-3 ${bg} transition-all transform translate-y-4 opacity-0`;
        toast.innerHTML = `
        <div class="flex items-center gap-2">
          <span>${type === "emergency" ? "🚨" : type === "success" ? "✓" : type === "warning" ? "⚠️" : "ℹ️"}</span>
          <span>${message}</span>
        </div>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white font-bold p-1">✕</button>
      `;

        container.appendChild(toast);
        setTimeout(() => {
          toast.classList.remove("translate-y-4", "opacity-0");
        }, 10);
        setTimeout(() => {
          toast.classList.add("opacity-0");
          setTimeout(() => toast.remove(), 300);
        }, 4500);
      }

      function triggerConfetti() {
        if (window.confetti) {
          try {
            window.confetti({
              particleCount: 70,
              spread: 60,
              origin: { y: 0.6 },
            });
          } catch (e) {}
        }
      }

      // ==========================================
      // ACTION HANDLERS
      // ==========================================
      window.Actions = {
        setActiveTab(tab) {
          AppState.activeTab = tab;
          AppState.sidebarTab = "overview";
          renderApp();
        },
        setSidebarTab(tab) {
          AppState.sidebarTab = tab;
          renderApp();
        },
        async login(email, password) {
          const normalizedEmail = String(email || "")
            .trim()
            .toLowerCase();
          const normalizedPassword = String(password || "");

          const demoUsers = [
            {
              id: "admin-1",
              name: "System Administrator",
              email: "admin@bloodguard.health",
              password: "Admin@123456",
              role: "admin",
              bloodGroup: "O+",
              phone: "+1 (415) 555-0199",
              isAvailable: true,
              lastDonationDate: "2024-01-01",
              totalDonations: 18,
              hospitalAffiliation: "City General Hospital",
            },
            {
              id: "donor-1",
              name: "Maria Lopez",
              email: "donor@bloodguard.health",
              password: "Donor@123456",
              role: "donor",
              bloodGroup: "O+",
              phone: "+1 (415) 555-0188",
              isAvailable: true,
              lastDonationDate: "2025-02-11",
              totalDonations: 7,
              hospitalAffiliation: "Mercy Clinic",
            },
            {
              id: "patient-1",
              name: "John Carter",
              email: "patient@bloodguard.health",
              password: "Patient@123456",
              role: "patient",
              bloodGroup: "A-",
              phone: "+1 (415) 555-0177",
              isAvailable: false,
              lastDonationDate: "",
              totalDonations: 0,
              hospitalAffiliation: "Northside Medical Center",
            },
          ];

          const user = demoUsers.find(
            (u) =>
              u.email === normalizedEmail && u.password === normalizedPassword,
          );
          if (!user) {
            throw new Error(
              "Invalid email or password. Try the default admin credentials shown below.",
            );
          }

          AppState.currentUser = {
            id: user.id,
            name: user.name,
            email: user.email,
            phone: user.phone,
            role: user.role,
            bloodGroup: user.bloodGroup,
            dateOfBirth: "",
            lastDonationDate: user.lastDonationDate || "",
            isAvailable: user.isAvailable ?? true,
            totalDonations: user.totalDonations || 0,
            hospitalAffiliation: user.hospitalAffiliation || "",
          };

          AppState.activeTab =
            user.role === "patient"
              ? "patient-dashboard"
              : user.role === "donor"
                ? "donor-dashboard"
                : "admin-dashboard";

          saveState();
          showToast(`Welcome back, ${user.name}!`, "success");
          renderApp();
          return user;
        },
        async register(formData) {
          const user = {
            id: `user-${Date.now()}`,
            name: formData.name || "New User",
            email: String(formData.email || "")
              .trim()
              .toLowerCase(),
            phone: formData.phone || "",
            role: formData.role || "donor",
            bloodGroup: formData.bloodGroup || "O+",
            dateOfBirth: formData.dateOfBirth || "",
            lastDonationDate: formData.lastDonationDate || "",
            isAvailable: formData.isAvailable !== false,
            totalDonations: 0,
            hospitalAffiliation: formData.hospitalAffiliation || "",
          };

          AppState.currentUser = { ...user };
          AppState.activeTab =
            user.role === "patient"
              ? "patient-dashboard"
              : user.role === "donor"
                ? "donor-dashboard"
                : "admin-dashboard";
          saveState();
          showToast(`Account created for ${user.name}!`, "success");
          renderApp();
          return user;
        },
        logout() {
          AppState.currentUser = GUEST_USER;
          AppState.activeTab = "landing";
          AppState.sidebarTab = "overview";
          saveState();
          showToast("Logged out successfully.", "info");
          renderApp();
        },
        toggleAvailability() {
          const u = AppState.currentUser;
          if (u && u.role === "donor") {
            u.isAvailable = !u.isAvailable;
            saveState();
            showToast(
              `Availability: ${u.isAvailable ? "🟢 AVAILABLE" : "🔴 UNAVAILABLE"}`,
              "info",
            );
            renderApp();
          }
        },
        createEmergencyRequest(formData) {
          // Fallback local logic (used only when backend is offline)
          const units = Number(formData.unitsRequired);
          let anomalyScore = 0.14;
          const indicators = [];
          if (units >= 5) {
            anomalyScore += 0.42;
            indicators.push(
              `Unusual Bulk Unit Demand (${units} Units requested)`,
            );
          }
          if (["AB-", "B-", "O-"].includes(formData.bloodGroup) && units >= 4) {
            anomalyScore += 0.25;
            indicators.push(
              `High Volume Demand for Scarce Blood Group (${formData.bloodGroup})`,
            );
          }
          anomalyScore = Math.min(0.98, Number(anomalyScore.toFixed(2)));
          const isFlagged = anomalyScore >= 0.55;
          const newId = `REQ-${Date.now()}`;
          const newReq = {
            id: newId,
            patientId: AppState.currentUser.id,
            patientName: formData.patientName || AppState.currentUser.name,
            contactPhone: formData.contactPhone || AppState.currentUser.phone,
            bloodGroup: formData.bloodGroup,
            unitsRequired: units,
            urgency: formData.urgency || "CRITICAL",
            hospitalName: formData.hospitalName,
            additionalNotes: formData.additionalNotes || "",
            status: isFlagged ? "suspicious_review" : "broadcasting",
            anomalyScore,
            fraudIndicators: indicators,
            isFlagged,
            broadcastTime: isFlagged ? null : new Date().toISOString(),
            eligibleDonorsNotifiedCount: isFlagged ? 0 : 0,
            createdAt: new Date().toISOString(),
          };
          AppState.requests.unshift(newReq);
          AppState.notifications.unshift({
            id: "notif-" + Date.now(),
            type: "emergency",
            title: isFlagged
              ? `⚠ Flagged: ${formData.bloodGroup}`
              : `🚨 Broadcast: ${formData.bloodGroup} Needed`,
            message: isFlagged
              ? `Request flagged for Admin review (Score: ${anomalyScore})`
              : `Broadcast sent to eligible ${formData.bloodGroup} donors.`,
            timestamp: "Just now",
            isRead: false,
          });
          saveState();
          closeModal();
          showToast(
            isFlagged
              ? "Request flagged for Admin review"
              : `Broadcast sent to eligible ${formData.bloodGroup} donors.`,
            isFlagged ? "warning" : "emergency",
          );
          renderApp();
        },
        acceptRequest(reqId) {
          const r = AppState.requests.find((x) => x.id === reqId);
          if (!r || r.status === "accepted" || r.status === "fulfilled") {
            showToast("This request has already been accepted.", "info");
            return;
          }
          r.status = "accepted";
          r.acceptedByDonorId = AppState.currentUser.id;
          r.acceptedByDonorName = AppState.currentUser.name;
          r.acceptedAt = new Date().toISOString();
          triggerConfetti();
          saveState();
          showToast(
            `✓ Accepted! Please coordinate with the hospital.`,
            "success",
          );
          renderApp();
        },
        fulfillRequest(reqId) {
          const r = AppState.requests.find((x) => x.id === reqId);
          if (r) {
            r.status = "fulfilled";
            saveState();
            showToast(`Request marked as FULFILLED.`, "success");
            closeModal();
            renderApp();
          }
        },
        approveFlagged(reqId) {
          const r = AppState.requests.find((x) => x.id === reqId);
          if (r) {
            r.status = "broadcasting";
            r.isFlagged = false;
            r.broadcastTime = new Date().toISOString();
            saveState();
            showToast(`Request approved and broadcast.`, "success");
            renderApp();
          }
        },
        rejectFlagged(reqId) {
          const r = AppState.requests.find((x) => x.id === reqId);
          if (r) {
            r.status = "rejected";
            saveState();
            showToast(`Request rejected.`, "info");
            renderApp();
          }
        },
        adjustStock(bg, delta) {
          const item = AppState.inventory.find((i) => i.bloodGroup === bg);
          if (item) {
            item.units = Math.max(0, item.units + delta);
            item.status =
              item.units <= 5
                ? "critical"
                : item.units <= 15
                  ? "low"
                  : "normal";
            item.lastUpdated = new Date().toISOString();
            saveState();
            showToast(`${bg}: ${delta > 0 ? "+" : ""}${delta} units`, "info");
            renderApp();
          }
        },
        setStock(bg, units) {
          const item = AppState.inventory.find((i) => i.bloodGroup === bg);
          if (item) {
            item.units = Math.max(0, Number(units));
            item.status =
              item.units <= 5
                ? "critical"
                : item.units <= 15
                  ? "low"
                  : "normal";
            item.lastUpdated = new Date().toISOString();
            saveState();
            showToast(`${bg} set to ${units} units`, "success");
            closeModal();
            renderApp();
          }
        },
        updateDonationDate(date) {
          AppState.currentUser.lastDonationDate = date;
          saveState();
          showToast(
            "Donation date updated. 56-day rule recalculated.",
            "success",
          );
          closeModal();
          renderApp();
        },
        markAllRead() {
          AppState.notifications.forEach((n) => (n.isRead = true));
          saveState();
          renderApp();
        },
      };

      // ==========================================
      // MODAL HELPERS
      // ==========================================
      function openModal(title, subtitle, contentHtml) {
        const modal = document.getElementById("modal-container");
        modal.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 z-10 space-y-4 max-h-[90vh] overflow-y-auto">
          <div class="flex items-start justify-between border-b border-slate-100 pb-3">
            <div>
              <h3 class="text-lg font-bold text-slate-900">${title}</h3>
              ${subtitle ? `<p class="text-xs text-slate-500 mt-0.5">${subtitle}</p>` : ""}
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 font-black text-xl p-1">✕</button>
          </div>
          <div>${contentHtml}</div>
        </div>
      `;
        modal.classList.remove("hidden");
      }

      function closeModal() {
        const modal = document.getElementById("modal-container");
        modal.classList.add("hidden");
        modal.innerHTML = "";
      }

      window.openCreateRequestModal = function () {
        // Auth guard — must be logged in
        if (!AppState.currentUser || AppState.currentUser.role === "guest") {
          showToast(
            "Please login or register to submit an emergency request.",
            "info",
          );
          Actions.setActiveTab("login");
          return;
        }
        const cur = AppState.currentUser;
        const html = `
        <form id="emergency-req-form" class="space-y-4 text-xs">
          <div class="p-3 rounded-2xl bg-amber-50 border border-amber-200 text-amber-900 flex items-start gap-2.5">
            <span class="text-base">🛡️</span>
            <div>
              <strong>Security Screening Notice:</strong> Your request will be securely screened by the Isolation Forest AI before being broadcast to eligible donors. Anomalous requests are routed to Admin Review.
            </div>
          </div>

          <div>
            <label class="font-bold text-slate-700 block mb-1">Select Blood Group</label>
            <div class="grid grid-cols-4 sm:grid-cols-8 gap-1.5">
              ${["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-"]
                .map(
                  (bg, idx) => `
                <label class="cursor-pointer">
                  <input type="radio" name="bloodGroup" value="${bg}" ${idx === 6 ? "checked" : ""} class="peer sr-only" />
                  <div class="py-2 text-center rounded-xl font-extrabold text-xs border border-slate-200 peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600">
                    ${bg}
                  </div>
                </label>
              `,
                )
                .join("")}
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="font-semibold text-slate-700 block mb-1">Units Required</label>
              <input type="number" name="unitsRequired" min="1" max="10" value="2" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold text-sm" required />
            </div>
            <div>
              <label class="font-semibold text-slate-700 block mb-1">Urgency</label>
              <select name="urgency" class="w-full p-2.5 rounded-xl border border-slate-300 font-semibold text-sm bg-white">
                <option value="CRITICAL">🚨 Critical</option>
                <option value="URGENT">⚡ Urgent</option>
                <option value="STANDARD">Standard</option>
              </select>
            </div>
            <div>
              <label class="font-semibold text-slate-700 block mb-1">Required Date/Time</label>
              <input type="datetime-local" name="requiredDate" class="w-full p-2.5 rounded-xl border border-slate-300 text-sm" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="font-semibold text-slate-700 block mb-1">Patient Name</label>
              <input type="text" name="patientName" value="${cur.name || ""}" class="w-full p-2.5 rounded-xl border border-slate-300 text-sm" required />
            </div>
            <div>
              <label class="font-semibold text-slate-700 block mb-1">Contact Number</label>
              <input type="text" name="contactPhone" value="${cur.phone || ""}" class="w-full p-2.5 rounded-xl border border-slate-300 text-sm font-mono" required />
            </div>
          </div>

          <div>
            <label class="font-semibold text-slate-700 block mb-1">Hospital / Medical Facility</label>
            <input type="text" name="hospitalName" placeholder="e.g. City General Hospital, Emergency Ward" class="w-full p-2.5 rounded-xl border border-slate-300 text-sm" required />
          </div>

          <div>
            <label class="font-semibold text-slate-700 block mb-1">Additional Notes</label>
            <textarea name="additionalNotes" rows="2" placeholder="e.g. Scheduled surgery, trauma case..." class="w-full p-2.5 rounded-xl border border-slate-300 text-sm resize-none"></textarea>
          </div>

          <div>
            <label class="font-semibold text-slate-700 block mb-1">
              📎 Hospital Prescription / Blood Requirement Document
              <span class="text-slate-400 font-normal">(PDF, JPG, PNG — max 5MB)</span>
            </label>
            <input type="file" id="doc-upload" name="document" accept=".pdf,.jpg,.jpeg,.png" class="w-full p-2 rounded-xl border border-slate-300 text-sm bg-white file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-red-50 file:text-red-700 file:font-semibold" />
            <p class="text-[10px] text-slate-400 mt-1">Document is stored securely. Only authorized medical personnel and admins can view it.</p>
          </div>

          <div class="flex justify-end gap-2 pt-2 border-t">
            <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-600 font-bold">Cancel</button>
            <button type="button" onclick="(async (event) => { const form = event.currentTarget.form; const fd = new FormData(form); const data = Object.fromEntries(fd); const fileInput = form.querySelector('#doc-upload'); if (fileInput && fileInput.files[0]) data.document = fileInput.files[0]; await Actions.createEmergencyRequest(data); })(event)" class="btn-red text-xs">🚨 Submit Emergency Request</button>
          </div>
        </form>
      `;
        openModal(
          "Create Emergency Blood Request",
          "Your request will be securely screened before being broadcast to eligible donors.",
          html,
        );
      };

      window.openTrackModal = function (reqId) {
        const r = AppState.requests.find((x) => x.id === reqId);
        if (!r) return;

        const isSuspicious = r.isFlagged || r.status === "suspicious_review";
        const stepsHtml =

    <script>
      (function () {
        "use strict";

        const API_BASE =
          window.location.protocol === "file:"
            ? "http://localhost:4000/api"
            : window.location.origin + "/api";
        let backendAvailable = false;
        let authToken = localStorage.getItem("bg_auth_token") || null;

        // ── API Helper ──────────────────────────────────────────
        async function api(endpoint, options = {}) {
          const headers = { ...(options.headers || {}) };
          if (authToken) headers["Authorization"] = `Bearer ${authToken}`;
          if (!(options.body instanceof FormData)) {
            headers["Content-Type"] = "application/json";
          }
          const res = await fetch(`${API_BASE}${endpoint}`, {
            ...options,
            headers,
            body:
              options.body instanceof FormData
                ? options.body
                : options.body
                  ? JSON.stringify(options.body)
                  : undefined,
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `API error ${res.status}`);
          return data;
        }

        // ── Check backend on load ───────────────────────────────
        async function checkBackend() {
          try {
            const data = await api("/health");
            backendAvailable = data.status === "ok";
            if (backendAvailable) {
              console.log("✅ BloodGuard backend connected:", data.mongodb);
              // If we have a saved token, verify it
              if (authToken) {
                try {
                  const me = await api("/auth/me");
                  setCurrentUserFromApi(me.user);
                  console.log(
                    "✅ Authenticated as:",
                    me.user.name,
                    `(${me.user.role})`,
                  );
                } catch (e) {
                  // Token expired or invalid
                  console.warn("Auth token expired, clearing.");
                  authToken = null;
                  localStorage.removeItem("bg_auth_token");
                }
              }
              overrideActions();
              renderApp();
              // Load real data if authenticated
              if (authToken) {
                window.Actions.refreshData &&
                  window.Actions.refreshData().catch(() => {});
              }
            }
          } catch (e) {
            console.log(
              "ℹ️ Backend not available, using localStorage demo mode.",
            );
            renderApp();
          }
        }

        function setCurrentUserFromApi(user) {
          AppState.currentUser = {
            id: user._id || user.id,
            name: user.name,
            email: user.email,
            phone: user.phone,
            role: user.role,
            bloodGroup: user.bloodGroup || "",
            dateOfBirth: user.dateOfBirth || "",
            lastDonationDate: user.lastDonationDate
              ? user.lastDonationDate.split("T")[0]
              : "",
            isAvailable: user.isAvailable ?? true,
            totalDonations: user.totalDonations || 0,
            hospitalAffiliation: user.hospitalAffiliation || "",
          };
          saveState();
        }

        // ── Override Actions with real API calls ─────────────────
        function overrideActions() {
          const origActions = { ...window.Actions };

          // ── AUTH: Register ──────────────────────────────────────
          window.Actions.register = async function (formData) {
            try {
              const data = await api("/auth/register", {
                method: "POST",
                body: {
                  name: formData.name,
                  email: formData.email,
                  phone: formData.phone,
                  password: formData.password,
                  role: formData.role || "donor",
                  bloodGroup: formData.bloodGroup,
                  dateOfBirth: formData.dateOfBirth,
                  lastDonationDate: formData.lastDonationDate,
                  isAvailable: formData.isAvailable !== false,
                  hospitalAffiliation: formData.hospitalAffiliation,
                },
              });
              authToken = data.token;
              localStorage.setItem("bg_auth_token", authToken);
              setCurrentUserFromApi(data.user);

              if (data.user.role === "patient")
                AppState.activeTab = "patient-dashboard";
              else if (data.user.role === "donor")
                AppState.activeTab = "donor-dashboard";
              else if (data.user.role === "admin")
                AppState.activeTab = "admin-dashboard";

              showToast(
                `✓ Registration successful! Welcome, ${data.user.name}`,
                "success",
              );
              closeModal();
              renderApp();
              // Load real data immediately
              window.Actions.refreshData().catch(() => {});
            } catch (e) {
              showToast(e.message, "error");
            }
          };

          // ── AUTH: Login ─────────────────────────────────────────
          window.Actions.login = async function (email, password) {
            try {
              const data = await api("/auth/login", {
                method: "POST",
                body: { email, password },
              });
              authToken = data.token;
              localStorage.setItem("bg_auth_token", authToken);
              setCurrentUserFromApi(data.user);

              if (data.user.role === "patient")
                AppState.activeTab = "patient-dashboard";
              else if (data.user.role === "donor")
                AppState.activeTab = "donor-dashboard";
              else if (data.user.role === "admin")
                AppState.activeTab = "admin-dashboard";

              showToast(`Welcome back, ${data.user.name}!`, "success");
              renderApp();
              // Load real data immediately after login
              window.Actions.refreshData().catch(() => {});
            } catch (e) {
              showToast(e.message, "error");
            }
          };

          // ── AUTH: Logout ────────────────────────────────────────
          window.Actions.logout = function () {
            authToken = null;
            localStorage.removeItem("bg_auth_token");
            AppState.currentUser = GUEST_USER; // guest until login
            AppState.activeTab = "landing";
            saveState();
            showToast("Logged out successfully.", "info");
            renderApp();
          };

          // ── Toggle Availability ─────────────────────────────────
          window.Actions.toggleAvailability = async function () {
            if (!authToken) return origActions.toggleAvailability();
            try {
              const newVal = !AppState.currentUser.isAvailable;
              await api("/auth/availability", {
                method: "PATCH",
                body: { isAvailable: newVal },
              });
              AppState.currentUser.isAvailable = newVal;
              saveState();
              showToast(
                `Availability: ${newVal ? "🟢 AVAILABLE" : "🔴 UNAVAILABLE"}`,
                "info",
              );
              renderApp();
            } catch (e) {
              showToast(e.message, "error");
            }
          };

          // ── Create Emergency Request (with document upload) ─────
          window.Actions.createEmergencyRequest = async function (formData) {
            if (!authToken) return origActions.createEmergencyRequest(formData);
            try {
              const fd = new FormData();
              fd.append("bloodGroup", formData.bloodGroup);
              fd.append("unitsRequired", formData.unitsRequired);
              fd.append("urgency", formData.urgency || "CRITICAL");
              fd.append(
                "patientName",
                formData.patientName || AppState.currentUser.name,
              );
              fd.append(
                "contactPhone",
                formData.contactPhone || AppState.currentUser.phone,
              );
              fd.append("hospitalName", formData.hospitalName);
              if (formData.additionalNotes)
                fd.append("additionalNotes", formData.additionalNotes);
              if (formData.requiredDate)
                fd.append("requiredDate", formData.requiredDate);
              // Document upload (file input)
              if (formData.document && formData.document instanceof File) {
                fd.append("document", formData.document);
              }

              const data = await api("/requests", { method: "POST", body: fd });

              // Add to local state for immediate UI update
              const req = data.request;
              AppState.requests.unshift({
                id: req._id,
                patientId: req.patientId,
                patientName: req.patientName,
                contactPhone: req.contactPhone,
                bloodGroup: req.bloodGroup,
                unitsRequired: req.unitsRequired,
                urgency: req.urgency,
                hospitalName: req.hospitalName,
                additionalNotes: req.additionalNotes || "",
                status: req.status,
                anomalyScore: req.anomalyScore,
                fraudIndicators: req.fraudIndicators || [],
                isFlagged: req.isFlagged,
                broadcastTime: req.broadcastTime,
                eligibleDonorsNotifiedCount:
                  req.eligibleDonorsNotifiedCount || 0,
                documentPath: req.documentPath,
                createdAt: req.createdAt,
              });

              AppState.notifications.unshift({
                id: "notif-" + Date.now(),
                type: "emergency",
                title: data.isFlagged
                  ? `⚠ Flagged: ${req.bloodGroup} (Score: ${req.anomalyScore})`
                  : `🚨 Broadcast: ${req.bloodGroup} Needed`,
                message: data.message,
                timestamp: "Just now",
                isRead: false,
              });

              saveState();
              closeModal();
              showToast(data.message, data.isFlagged ? "warning" : "emergency");
              renderApp();
            } catch (e) {
              showToast(e.message, "error");
            }
          };

          // ── Accept Request (atomic first-wins) ─────────────────
          window.Actions.acceptRequest = async function (reqId) {
            if (!authToken) return origActions.acceptRequest(reqId);
            try {
              const data = await api(`/requests/${reqId}/accept`, {
                method: "POST",
              });

              // Update local state
              const r = AppState.requests.find((x) => x.id === reqId);
              if (r) {
                r.status = "accepted";
                r.acceptedByDonorId = AppState.currentUser.id;
                r.acceptedByDonorName = AppState.currentUser.name;
                r.acceptedAt = new Date().toISOString();
              }

              triggerConfetti();

              // Show accepted donor details for patient visibility
              if (data.acceptedDonorDetails) {
                const d = data.acceptedDonorDetails;
                AppState.notifications.unshift({
                  id: "notif-" + Date.now(),
                  type: "update",
                  title: `❤️ Donor Connected!`,
                  message: `${d.name} (${d.bloodGroup}) accepted. Contact: ${d.phone}`,
                  timestamp: "Just now",
                  isRead: false,
                });
              }

              saveState();
              showToast(data.message, "success");
              renderApp();
            } catch (e) {
              showToast(e.message, "error");
            }
          };

          // ── Fulfill Request ─────────────────────────────────────
          window.Actions.fulfillRequest = async function (reqId) {
            if (!authToken) return origActions.fulfillRequest(reqId);
            try {
              await api(`/requests/${reqId}/fulfill`, { method: "POST" });
              const r = AppState.requests.find((x) => x.id === reqId);
              if (r) r.status = "fulfilled";
              saveState();
              showToast(`Request marked as FULFILLED.`, "success");
              closeModal();
              renderApp();
            } catch (e) {
              showToast(e.message, "error");
            }
          };

          // ── Admin: Approve Flagged ──────────────────────────────
          window.Actions.approveFlagged = async function (reqId) {
            if (!authToken) return origActions.approveFlagged(reqId);
            try {
              const data = await api(`/admin/requests/${reqId}/approve`, {
                method: "POST",
              });
              const r = AppState.requests.find((x) => x.id === reqId);
              if (r) {
                r.status = "broadcasting";
                r.isFlagged = false;
                r.broadcastTime = new Date().toISOString();
                r.eligibleDonorsNotifiedCount =
                  data.broadcast?.eligibleDonorsCount || 0;
              }
              AppState.notifications.unshift({
                id: "notif-" + Date.now(),
                type: "emergency",
                title: `🚨 Admin Approved: ${r?.bloodGroup || ""} Broadcast`,
                message: data.message,
                timestamp: "Just now",
                isRead: false,
              });
              saveState();
              showToast(data.message, "success");
              renderApp();
            } catch (e) {
              showToast(e.message, "error");
            }
          };

          // ── Admin: Reject Flagged ───────────────────────────────
          window.Actions.rejectFlagged = async function (reqId) {
            if (!authToken) return origActions.rejectFlagged(reqId);
            try {
              await api(`/admin/requests/${reqId}/reject`, { method: "POST" });
              const r = AppState.requests.find((x) => x.id === reqId);
              if (r) r.status = "rejected";
              saveState();
              showToast(`Request rejected and blocked.`, "info");
              renderApp();
            } catch (e) {
              showToast(e.message, "error");
            }
          };

          // ── Admin: Adjust Inventory ─────────────────────────────
          window.Actions.adjustStock = async function (bg, delta) {
            if (!authToken || AppState.currentUser.role !== "admin") {
              return origActions.adjustStock(bg, delta);
            }
            try {
              const item = AppState.inventory.find((i) => i.bloodGroup === bg);
              const newUnits = Math.max(0, (item?.units || 0) + delta);
              const data = await api(
                `/admin/inventory/${encodeURIComponent(bg)}`,
                {
                  method: "PATCH",
                  body: { units: newUnits },
                },
              );
              if (item) {
                item.units = data.inventory.units;
                item.status = data.inventory.status;
                item.lastUpdated = data.inventory.lastUpdated;
              }
              saveState();
              showToast(`${bg}: ${delta > 0 ? "+" : ""}${delta} units`, "info");
              renderApp();
            } catch (e) {
              showToast(e.message, "error");
            }
          };

          window.Actions.setStock = async function (bg, units) {
            if (!authToken || AppState.currentUser.role !== "admin") {
              return origActions.setStock(bg, units);
            }
            try {
              const data = await api(
                `/admin/inventory/${encodeURIComponent(bg)}`,
                {
                  method: "PATCH",
                  body: { units: Math.max(0, Number(units)) },
                },
              );
              const item = AppState.inventory.find((i) => i.bloodGroup === bg);
              if (item) {
                item.units = data.inventory.units;
                item.status = data.inventory.status;
                item.lastUpdated = data.inventory.lastUpdated;
              }
              saveState();
              showToast(
                `${bg} set to ${data.inventory.units} units`,
                "success",
              );
              closeModal();
              renderApp();
            } catch (e) {
              showToast(e.message, "error");
            }
          };

          // ── Update Last Donation Date ───────────────────────────
          window.Actions.updateDonationDate = async function (date) {
            if (!authToken) return origActions.updateDonationDate(date);
            try {
              await api("/auth/last-donation", {
                method: "PATCH",
                body: { lastDonationDate: date },
              });
              AppState.currentUser.lastDonationDate = date;
              saveState();
              showToast(
                "Donation date updated. 56-day rule recalculated.",
                "success",
              );
              closeModal();
              renderApp();
            } catch (e) {
              showToast(e.message, "error");
            }
          };

          // ── Load real data from API ─────────────────────────────
          window.Actions.refreshData = async function () {
            if (!authToken) return;
            try {
              // Load requests
              const reqData = await api("/requests");
              if (reqData.requests) {
                AppState.requests = reqData.requests.map((r) => ({
                  id: r._id,
                  patientId: r.patientId?._id || r.patientId,
                  patientName: r.patientName,
                  contactPhone: r.contactPhone,
                  bloodGroup: r.bloodGroup,
                  unitsRequired: r.unitsRequired,
                  urgency: r.urgency,
                  hospitalName: r.hospitalName,
                  additionalNotes: r.additionalNotes || "",
                  status: r.status,
                  anomalyScore: r.anomalyScore,
                  fraudIndicators: r.fraudIndicators || [],
                  isFlagged: r.isFlagged,
                  broadcastTime: r.broadcastTime,
                  eligibleDonorsNotifiedCount:
                    r.eligibleDonorsNotifiedCount || 0,
                  acceptedByDonorId:
                    r.acceptedByDonorId?._id || r.acceptedByDonorId,
                  acceptedByDonorName: r.acceptedByDonorName,
                  acceptedDonorDetails: r.acceptedDonorDetails || null,
                  acceptedAt: r.acceptedAt,
                  documentPath: r.documentPath,
                  requiredDate: r.requiredDate,
                  createdAt: r.createdAt,
                }));
              }

              // Load inventory and admin stats
              if (AppState.currentUser.role === "admin") {
                try {
                  const invData = await api("/admin/inventory");
                  if (invData.inventory) {
                    AppState.inventory = invData.inventory.map((i) => ({
                      bloodGroup: i.bloodGroup,
                      units: i.units,
                      status: i.status,
                      lastUpdated: i.lastUpdated || i.updatedAt,
                    }));
                  }
                  const statsData = await api("/admin/stats");
                  if (statsData) {
                    AppState.adminStats = {
                      totalUsers: statsData.totalUsers || 0,
                      totalDonors: statsData.totalDonors || 0,
                      availableDonors: statsData.availableDonors || 0,
                      totalRequests: statsData.totalRequests || 0,
                      activeRequests: statsData.activeRequests || 0,
                      suspiciousRequests: statsData.suspiciousRequests || 0,
                      fulfilledRequests: statsData.fulfilledRequests || 0,
                    };
                  }
                } catch (e) {
                  /* non-fatal */
                }
              }

              saveState();
              renderApp();
            } catch (e) {
              console.warn("Data refresh failed:", e.message);
            }
          };

          // Auto-refresh data after login
          if (authToken) {
            window.Actions.refreshData();
          }
        }

        // ── Boot ─────────────────────────────────────────────────
        // Clear old demo-mode localStorage keys so no fake data appears
        [
          "bg_users",
          "bg_requests",
          "bg_notifications",
          "bg_current_user_id",
        ].forEach((k) => localStorage.removeItem(k));

        checkBackend();

        // ── SMS Test Helper (Admin Dashboard) ────────────────────
        window.testSMS = async function () {
          const phoneEl = document.getElementById("sms-test-phone");
          const resultEl = document.getElementById("sms-test-result");
          if (!phoneEl || !resultEl) return;

          const phone = phoneEl.value.trim();
          if (!phone) {
            resultEl.innerHTML =
              '<span class="text-red-600 font-bold">❌ Enter a phone number first.</span>';
            return;
          }

          resultEl.innerHTML =
            '<span class="text-slate-400 animate-pulse">⏳ Sending...</span>';

          try {
            const token = localStorage.getItem("bg_auth_token");
            const res = await fetch("/api/admin/sms/test", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + token,
              },
              body: JSON.stringify({ phone }),
            });
            const data = await res.json();

            if (data.result && data.result.success) {
              if (data.provider === "disabled") {
                resultEl.innerHTML = `<div class="space-y-1">
              <p class="font-bold text-amber-700">⚠️ SMS_PROVIDER is "disabled"</p>
              <p class="text-amber-600">Message logged to server console only.</p>
              <p class="text-slate-500 text-[10px] mt-2">${data.note || ""}</p>
            </div>`;
              } else {
                resultEl.innerHTML = `<div class="space-y-1">
              <p class="font-bold text-emerald-700">✅ SMS Sent Successfully!</p>
              <p class="text-slate-600">Provider: <strong>${data.provider}</strong></p>
              ${data.result.requestId ? `<p class="text-slate-500">Request ID: ${data.result.requestId}</p>` : ""}
              <p class="text-slate-500">Sent to: ${data.phone}</p>
            </div>`;
              }
            } else {
              resultEl.innerHTML = `<div class="space-y-1">
            <p class="font-bold text-red-700">❌ SMS Failed</p>
            <p class="text-red-600 text-[11px]">${data.result?.error || "Unknown error"}</p>
            <p class="text-slate-500 text-[10px]">${data.note || ""}</p>
          </div>`;
            }
          } catch (e) {
            resultEl.innerHTML = `<span class="text-red-600 font-bold">❌ ${e.message}</span>`;
          }
        };

        // Auto-check SMS status when admin dashboard loads
        window.checkSMSStatus = async function () {
          const badge = document.getElementById("sms-status-badge");
          if (!badge) return;
          try {
            const token = localStorage.getItem("bg_auth_token");
            const res = await fetch("/api/admin/sms/status", {
              headers: { Authorization: "Bearer " + token },
            });
            const data = await res.json();
            if (data.provider === "disabled") {
              badge.className =
                "text-xs px-3 py-1 rounded-full bg-slate-200 text-slate-600 font-bold";
              badge.textContent = "⚫ Disabled";
            } else if (data.configured) {
              badge.className =
                "text-xs px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 font-bold";
              badge.textContent = `✅ ${data.provider} Ready`;
            } else {
              badge.className =
                "text-xs px-3 py-1 rounded-full bg-red-100 text-red-700 font-bold";
              badge.textContent = "❌ Not Configured";
            }
          } catch (e) {
            /* non-admin or network error */
          }
        };

        // Poll for SMS status badge every time admin dashboard renders
        const _origRenderApp = window.renderApp || function () {};
        const _smsStatusPoller = setInterval(() => {
          if (document.getElementById("sms-status-badge")) {
            window.checkSMSStatus();
            clearInterval(_smsStatusPoller);
          }
        }, 800);
      })();
    </script>
  </body>
</html>
